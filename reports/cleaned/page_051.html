<!doctype html><html lang="en"><meta charset="utf-8"><title>Reviewed page 51</title><style>body{max-width:1000px;margin:32px auto;padding:20px;font-family:system-ui;line-height:1.6}img{max-width:100%;max-height:1000px}figure{margin:20px 0}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px}article{border:1px solid #ccc;padding:20px;margin:24px 0}</style><h1>EXAMPLE BATTLEFIELDS (continued)</h1><figure><img src="images/page_051_narrative.png" alt="Narrative Play Focused battlefield"><figcaption><p>Narrative Play Focused: This Strike Force battlefield has an ideal number and mixture of terrain features. The largest pieces of Area Terrain have been set up along the two long battlefield edges, while the middle of the battlefield only has a scattering of Obstacles to provide any kind of shelter from enemy fire. While this battlefield is not ideal for a matched play game, it would make for a very thematic set-up for a narrative play game.</p></figcaption></figure><figure><img src="images/page_051_matched.png" alt="Matched Play Focused battlefield"><figcaption><p>Matched Play Focused: This Strike Force battlefield is very similar to the one above in terms of number and types of terrain features, but they have been set up more evenly across the battlefield, and the middle contains terrain features that block visibility from one side of the battlefield to the other. This battlefield doesn&#x27;t give an advantage to one player or the other, and is far more suited to a typical matched play game.</p></figcaption></figure></html>
