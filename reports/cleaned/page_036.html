<!doctype html><html lang="en"><meta charset="utf-8"><title>Reviewed page 36</title><style>body{max-width:1000px;margin:32px auto;padding:20px;font-family:system-ui;line-height:1.6}img{max-width:100%;max-height:1000px}figure{margin:20px 0}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px}article{border:1px solid #ccc;padding:20px;margin:24px 0}</style><h1>FIGHT — illustrated example</h1><figure><img src="images/page_036_fight_ab.png" alt="A/B — Pile in and eligible attacks"><figcaption><p>A The Termagant unit is selected to fight. First, the unit Piles In and all of its models move up to 3&quot; in order to end closer to the closest enemy model, and in base-to-base contact if they can. Note that two Termagants are already in base-to-base contact with the foe - these models therefore do not move.</p><p>B After making their Pile-in moves, five of the Termagants are within Engagement Range of the Sternguard Veterans, and so will get to make attacks. Three other Termagants are in base-to-base contact with models in their unit that are themselves in base-to-base contact with the Sternguard Veterans - these Termagants will also get to make attacks. The remaining two Termagants are too distant from the foe, and will not get to make attacks.</p></figcaption></figure><figure><img src="images/page_036_fight_c.png" alt="C — Consolidation"><figcaption><p>C After the Termagants have made all of their attacks, one enemy model has been destroyed. The Termagants now Consolidate; just like when they Piled In, each model must move up to 3&quot; in order to end closer to the closest enemy model, and in base-to-base contact if they can. Three Termagants are already in base-to-base contact, and so are not moved.</p></figcaption></figure></html>
