<!doctype html><html lang="en"><meta charset="utf-8"><title>Reviewed page 50</title><style>body{max-width:1000px;margin:32px auto;padding:20px;font-family:system-ui;line-height:1.6}img{max-width:100%;max-height:1000px}figure{margin:20px 0}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px}article{border:1px solid #ccc;padding:20px;margin:24px 0}</style><h1>EXAMPLE BATTLEFIELDS (continued)</h1><figure><img src="images/page_050_comparison.png" alt="Battlefield comparison: upper and lower illustrations"><figcaption><p>Matched Play Focused: This Strike Force battlefield has fewer terrain features set up on it than the one below. The terrain has still been set up so as not to give an advantage to one player or the other, and there is still terrain set up in the middle that blocks visibility from one side of the battlefield to the other. As a result, this battlefield would make for an ideal matched play game. Battlefields with less terrain than this will start to advantage armies that rely on shooting over melee.</p></figcaption></figure></html>
