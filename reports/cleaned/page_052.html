<!doctype html><html lang="en"><meta charset="utf-8"><title>Reviewed page 52</title><style>body{max-width:1000px;margin:32px auto;padding:20px;font-family:system-ui;line-height:1.6}img{max-width:100%;max-height:1000px}figure{margin:20px 0}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:8px}article{border:1px solid #ccc;padding:20px;margin:24px 0}</style><h1>COMBAT PATROL SET-UPS</h1><figure><img src="images/page_052_matched.png" alt="Matched Play Focused: Combat Patrol"><figcaption><p>Matched Play Focused: This Combat Patrol battlefield (44&quot; x 30&quot;) has an ideal number and mixture of terrain features. These are set up evenly across the battlefield, there is still space for units to manoeuvre around them, and lines of sight cannot easily be drawn from one edge to the other, giving neither player a clear advantage.</p></figcaption></figure><figure><img src="images/page_052_matched_less_terrain.png" alt="Matched Play Focused: less terrain"><figcaption><p>Matched Play Focused: This Combat Patrol battlefield has been set up with fewer terrain features than the battlefield above, but the positioning of these does not favour one player over the other. A battlefield with fewer terrain features than this will afford units no way to gain protection from ranged attacks, and so will give a strong advantage to armies that rely on shooting, while disadvantaging armies that rely on melee.</p></figcaption></figure><figure><img src="images/page_052_narrative.png" alt="Narrative Play Focused: Combat Patrol"><figcaption><p>Narrative Play Focused: This Combat Patrol battlefield has an ideal number and mixture of terrain features, and has been set up to create a strong thematic battlefield that, while not ideally suited to all play styles, sets the scene for a thrilling narrative encounter.</p></figcaption></figure></html>
