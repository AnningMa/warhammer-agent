[project]
name = "warhammer-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "docling",
    "pymupdf>=1.28.2",
    "rapidocr>=3.9.2",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.0,<2", "numpy>=1.26,<3"]
gemini = ["google-genai>=1.0,<3", "python-dotenv>=1.0,<2", "numpy>=1.26,<3"]
qwen = ["sentence-transformers>=5.0,<6", "transformers>=4.51,<6", "numpy>=1.26,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warhammer_agent"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
