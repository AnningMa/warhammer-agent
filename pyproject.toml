[project]
name = "warhammer-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "docling",
    "pymupdf>=1.28.2",
    "rapidocr>=3.9.2",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
